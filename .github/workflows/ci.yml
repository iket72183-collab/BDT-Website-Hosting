name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check internal links and assets
        run: python3 scripts/check_site.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test inquiry handling without network submissions
        run: node --test scripts/test_forms.cjs
