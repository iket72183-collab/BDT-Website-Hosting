<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDT Talent Group</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      padding: 60px 24px 40px;
      width: 100%;
      max-width: 900px;
    }

    .logo {
      max-width: 600px;
      width: 85%;
      height: auto;
      display: block;
      margin: 0 auto 48px;
    }

    .hero h1 {
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .hero h1 span {
      color: #c9a84c;
    }

    .hero p {
      font-family: Arial, sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 0.12em;
      color: #b0b0b0;
      margin-top: 8px;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 32px auto;
      opacity: 0.6;
    }

    .coming-soon {
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="bdt-logo.jpeg" alt="BDT Talent Group Logo" class="logo" />

    <h1>AI-Powered Talent. <span>Human-Centered Culture.</span></h1>
    <p>Elevating the next generation of creators. The industry’s watching. 🚀</p>

    <div class="divider"></div>
    <div class="coming-soon">Official Website Coming Soon</div>
  </div>
</body>
</html>
