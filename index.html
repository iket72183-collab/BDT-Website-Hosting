<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDT Talent Group</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      padding: 60px 24px 40px;
      width: 100%;
      max-width: 900px;
    }

    .logo {
      max-width: 600px;
      width: 85%;
      height: auto;
      display: block;
      margin: 0 auto 48px;
    }

    .hero h1 {
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .hero h1 span {
      color: #c9a84c;
    }

    .hero p {
      font-family: Arial, sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 0.12em;
      color: #b0b0b0;
      margin-top: 8px;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 32px auto;
      opacity: 0.6;
    }

    .coming-soon {
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
    }

    .social-links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d8d8d8;
      text-decoration: none;
      padding: 10px 14px;
      border: 1px solid rgba(201, 168, 76, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid rgba(201, 168, 76, 0.32);
      background: rgba(201, 168, 76, 0.08);
      color: #f1e0ac;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .social-links a:hover {
      color: #c9a84c;
      border-color: rgba(201, 168, 76, 0.8);
      background: rgba(201, 168, 76, 0.08);
    }
  </style>

</head>
